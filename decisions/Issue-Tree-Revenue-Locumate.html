<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Issue Tree — Revenue Growth</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --muted: #78716c;
    --light: #a8a29e;
    --teal: #0f766e;
    --teal-bg: #f0fdfa;
    --green: #059669; --green-bg: #ecfdf5;
    --blue: #0369a1; --blue-bg: #f0f9ff;
    --red: #dc2626; --red-bg: #fef2f2;
    --purple: #7c3aed; --purple-bg: #f5f3ff;
    --amber: #d97706; --amber-bg: #fffbeb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); padding: 24px 16px;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header .subtitle { font-size: 0.78rem; color: var(--muted); }

  .root-node {
    background: var(--teal); color: white; padding: 18px 20px; border-radius: 12px;
    text-align: center; max-width: 600px; margin: 0 auto 8px;
  }
  .root-node .question { font-size: 1rem; font-weight: 700; }
  .root-node .amount { font-size: 0.78rem; margin-top: 6px; opacity: 0.85; }

  .connector-down {
    width: 2px; height: 20px; background: var(--border); margin: 0 auto;
  }

  .formula-bar {
    text-align: center; font-size: 0.72rem; color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; max-width: 700px; margin: 8px auto 20px;
    font-weight: 500;
  }

  .tag-toggle-bar {
    text-align: center; margin-bottom: 16px;
  }
  .tag-toggle-btn {
    font-size: 0.72rem; padding: 5px 14px; border-radius: 20px;
    border: 1.5px solid var(--border); background: var(--card);
    color: var(--muted); cursor: pointer; font-weight: 600; transition: all 0.2s;
  }
  .tag-toggle-btn.active {
    background: var(--teal-bg); color: var(--teal); border-color: var(--teal);
  }

  .branches {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    max-width: 1100px; margin: 0 auto 28px;
  }
  @media (max-width: 900px) { .branches { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 550px) { .branches { grid-template-columns: 1fr; } }

  .branch { border-radius: 12px; overflow: hidden; }
  .branch-header {
    padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    user-select: none; transition: background 0.2s;
  }
  .branch-header .num {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.68rem; font-weight: 700; color: white; flex-shrink: 0;
  }
  .branch-header .title { font-size: 0.82rem; font-weight: 600; }
  .branch-header .arrow {
    margin-left: auto; font-size: 0.65rem; transition: transform 0.2s;
  }
  .branch.open .branch-header .arrow { transform: rotate(90deg); }

  .branch.green .branch-header { background: var(--green-bg); color: var(--green); }
  .branch.green .num { background: var(--green); }
  .branch.blue .branch-header { background: var(--blue-bg); color: var(--blue); }
  .branch.blue .num { background: var(--blue); }
  .branch.red .branch-header { background: var(--red-bg); color: var(--red); }
  .branch.red .num { background: var(--red); }
  .branch.purple .branch-header { background: var(--purple-bg); color: var(--purple); }
  .branch.purple .num { background: var(--purple); }

  .sub-branches { display: none; padding: 0 8px 8px; }
  .branch.open .sub-branches { display: block; }

  .sub-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; margin-top: 8px; overflow: hidden;
  }
  .sub-title {
    padding: 10px 12px; cursor: pointer; display: flex; align-items: center;
    gap: 6px; font-size: 0.78rem; font-weight: 600; user-select: none;
  }
  .sub-title .toggle { font-size: 0.6rem; color: var(--light); transition: transform 0.2s; }
  .sub-card.open .sub-title .toggle { transform: rotate(90deg); }
  .sub-detail {
    display: none; padding: 8px 12px 12px; border-top: 1px solid var(--border);
    font-size: 0.74rem; color: var(--muted); line-height: 1.55;
  }
  .sub-card.open .sub-detail { display: block; }

  .obs-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .obs-list li { padding: 3px 0 3px 14px; position: relative; }
  .obs-list li::before {
    content: ''; position: absolute; left: 0; top: 10px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--light);
  }

  .tags-row { display: none; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .tags-row.visible { display: flex; }
  .tag {
    font-size: 0.62rem; font-weight: 600; padding: 2px 7px; border-radius: 3px;
  }
  .tag.data { background: var(--blue-bg); color: var(--blue); }
  .tag.gap { background: var(--amber-bg); color: var(--amber); }
  .tag.risk { background: var(--red-bg); color: var(--red); }

  .summary-bar {
    max-width: 1100px; margin: 0 auto 24px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px;
  }
  .summary-bar h2 { font-size: 0.92rem; font-weight: 700; margin-bottom: 12px; }
  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px;
  }
  .summary-item {
    padding: 10px 14px; border-radius: 8px; border-left: 4px solid;
    font-size: 0.78rem; line-height: 1.5;
  }
  .summary-item strong { display: block; font-size: 0.82rem; margin-bottom: 2px; }
  .summary-item.finding { border-color: var(--green); background: var(--green-bg); }
  .summary-item.risk-item { border-color: var(--red); background: var(--red-bg); }
  .summary-item.opportunity { border-color: var(--blue); background: var(--blue-bg); }

  footer {
    text-align: center; font-size: 0.68rem; color: var(--light); padding-top: 12px;
  }

  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Issue Tree</h1>
    <div class="subtitle" id="pageSubtitle"></div>
  </header>

  <div id="content">
    <div class="loading" id="loadingMsg">Loading issue tree data…</div>
  </div>

  <footer id="footerEl"></footer>

<script>
const BRANCH_COLORS = ['green', 'blue', 'red', 'purple'];

let tagsVisible = false;

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toggleBranch(e, el) {
  if (e.target.closest('.sub-card')) return;
  el.classList.toggle('open');
}

function toggleCard(e, el) {
  e.stopPropagation();
  el.classList.toggle('open');
}

function toggleTags() {
  tagsVisible = !tagsVisible;
  document.querySelectorAll('.tags-row').forEach(el => el.classList.toggle('visible', tagsVisible));
  document.querySelector('.tag-toggle-btn')?.classList.toggle('active', tagsVisible);
}

function renderSubCard(card) {
  const obsHtml = (card.observations || [])
    .map(o => `<li>${esc(o)}</li>`).join('');

  const tagsHtml = (card.tags || [])
    .map(t => `<span class="tag ${t.type}">${esc(t.label)}</span>`).join('');

  return `<div class="sub-card" onclick="toggleCard(event, this)">
    <div class="sub-title">
      <span class="toggle">&#9654;</span>
      ${esc(card.subIssueId)}. ${esc(card.subIssueName)}
    </div>
    <div class="sub-detail">
      <ul class="obs-list">${obsHtml}</ul>
      ${tagsHtml ? `<div class="tags-row${tagsVisible ? ' visible' : ''}">${tagsHtml}</div>` : ''}
    </div>
  </div>`;
}

function renderBranch(branch, cards, colorIdx) {
  const color = BRANCH_COLORS[colorIdx % BRANCH_COLORS.length];
  const open = colorIdx === 0 ? ' open' : '';
  const subCardsHtml = branch.subIssues
    .map(si => {
      const card = cards.find(c => c.subIssueId === si.subIssueId);
      return card ? renderSubCard(card) : `<div class="sub-card"><div class="sub-title"><span class="toggle">&#9654;</span>${esc(si.subIssueId)}. ${esc(si.name)} (no data)</div></div>`;
    }).join('');

  return `<div class="branch ${color}${open}" onclick="toggleBranch(event, this)">
    <div class="branch-header">
      <div class="num">${branch.branchIndex}</div>
      <div class="title">${esc(branch.label)}</div>
      <span class="arrow">&#9654;</span>
    </div>
    <div class="sub-branches">${subCardsHtml}</div>
  </div>`;
}

function renderSummaryItem(t) {
  const cls = t.summaryCategory === 'risk' ? 'risk-item'
    : t.summaryCategory === 'opportunity' ? 'opportunity'
    : 'finding';
  return `<div class="summary-item ${cls}">
    <strong>${esc(t.title)}</strong>
    ${esc(t.text)}
  </div>`;
}

async function init() {
  let data;
  try {
    const resp = await fetch('../out/briefing-latest.json');
    data = await resp.json();
  } catch {
    document.getElementById('loadingMsg').textContent = 'Could not load data. Run the pipeline first.';
    return;
  }

  const tree = data.issueTree;
  const cards = data.analysisCards;
  const takeaways = data.branchTakeaways;

  document.getElementById('pageTitle').textContent = `Issue Tree — ${data.orgName}`;
  document.getElementById('pageSubtitle').textContent = new Date(data.generatedAt).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });

  const summaryParts = Object.entries(tree.summaryStats || {})
    .map(([, v]) => v).join(' · ');

  let html = '';

  html += `<div class="root-node">
    <div class="question">${esc(tree.rootIssue)}</div>
    ${summaryParts ? `<div class="amount">${esc(summaryParts)}</div>` : ''}
  </div>`;

  html += `<div class="connector-down"></div>`;
  html += `<div class="formula-bar">${esc(tree.formulaLabel)}</div>`;

  html += `<div class="tag-toggle-bar">
    <button class="tag-toggle-btn" onclick="toggleTags()">Show / hide tags</button>
  </div>`;

  html += `<div class="branches">`;
  tree.branches.forEach((b, i) => {
    html += renderBranch(b, cards, i);
  });
  html += `</div>`;

  html += `<div class="summary-bar">
    <h2>Key Takeaways from the Data</h2>
    <div class="summary-grid">${takeaways.map(renderSummaryItem).join('')}</div>
  </div>`;

  document.getElementById('loadingMsg').remove();
  document.getElementById('content').innerHTML = html;

  const sources = (data.dataQuality?.sources || []).map(s => s.sourceId).join(', ');
  document.getElementById('footerEl').textContent = `Data sources: ${sources || 'N/A'}`;
}

init();
</script>
</body>
</html>
